# ┌─────────────────────────────────────────────────────────────────────────┐
# │ TEMPLATE — do NOT commit real values to source control.                 │
# │                                                                         │
# │ Populate with:                                                          │
# │   kubectl create secret generic chatbot-secret -n chatbot \            │
# │     --from-literal=AZURE_FOUNDRY_ENDPOINT="https://..." \              │
# │     --from-literal=AZURE_FOUNDRY_KEY="..." \                           │
# │     --from-literal=COSMOS_ENDPOINT="https://..." \                     │
# │     --from-literal=COSMOS_KEY="..." \                                  │
# │     --from-literal=REDIS_HOST="<cache>.redis.cache.windows.net" \      │
# │     --from-literal=REDIS_PASSWORD="..."                                │
# └─────────────────────────────────────────────────────────────────────────┘
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-secret
  namespace: chatbot
type: Opaque
data:
  # All values must be base64-encoded. Replace placeholders.
  AZURE_FOUNDRY_ENDPOINT: <base64-encoded-value>
  AZURE_FOUNDRY_KEY: <base64-encoded-value>
  COSMOS_ENDPOINT: <base64-encoded-value>
  COSMOS_KEY: <base64-encoded-value>
  REDIS_HOST: <base64-encoded-value>
  REDIS_PASSWORD: <base64-encoded-value>
