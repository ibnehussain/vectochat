apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: chatbot
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /health
spec:
  type: LoadBalancer
  selector:
    app: chatbot
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
