<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VectoChat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #0078d4;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.15);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #session-label { font-size: 0.72rem; opacity: 0.75; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.93rem;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #dde1e7;
      border-bottom-left-radius: 3px;
      color: #1b1b1b;
    }
    .bubble.assistant code {
      background: #f4f4f4;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.88em;
    }
    .bubble.assistant pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 8px;
    }

    .sources {
      font-size: 0.75rem;
      color: #666;
      margin-top: 8px;
      border-top: 1px solid #eee;
      padding-top: 6px;
    }
    .sources span { font-weight: 600; }

    .loading-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #aaa;
      animation: blink 1.2s infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

    #input-row {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #dde1e7;
    }
    #user-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.93rem;
      outline: none;
      resize: none;
      font-family: inherit;
    }
    #user-input:focus { border-color: #0078d4; }
    #send-btn {
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 22px;
      font-size: 0.93rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #005fa3; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
    #clear-btn {
      background: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #555;
    }
    #clear-btn:hover { border-color: #e74c3c; color: #e74c3c; }
  </style>
</head>
<body>
  <header>
    <h1>VectoChat</h1>
    <div id="session-label">Loading session…</div>
  </header>

  <div id="chat-container"></div>

  <div id="input-row">
    <textarea id="user-input" rows="2" placeholder="Ask a question…"></textarea>
    <button id="clear-btn" title="Clear conversation">Clear</button>
    <button id="send-btn">Send</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
